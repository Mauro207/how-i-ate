<nav class="relative" style="padding-top: env(safe-area-inset-top, 0px)">
  <div class="px-3 mx-auto max-w-7xl sm:px-4 lg:px-8">
    <div class="relative flex items-center justify-between md:h-16"
         [ngClass]="(!backUrl && !showEditBtn && !showDeleteBtn) ? 'h-0 overflow-hidden pointer-events-none' : 'h-12'">

      <!-- Left: Back button (floating, visible only when backUrl is set) -->
      <div class="flex items-center">
        <a
          *ngIf="backUrl"
          [routerLink]="backUrl"
          class="flex items-center justify-center w-9 h-9 rounded-xl bg-white/80 dark:bg-[#2b2930]/80 backdrop-blur-md shadow-sm border border-black/5 dark:border-white/10 text-gray-700 dark:text-gray-200 hover:bg-[#f3eeff] dark:hover:bg-[#6750a4]/20 transition-colors"
          aria-label="Torna indietro"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
          </svg>
        </a>
      </div>

      <!-- Logo: desktop only -->
      <h1 class="hidden md:block absolute left-1/2 -translate-x-1/2 text-2xl font-bold text-[#6750a4] dark:text-[#d0bcff] select-none">
        How I Ate
      </h1>

      <!-- Right: contextual actions + desktop nav floating card -->
      <div class="relative z-10 flex flex-row items-center gap-2">

        <!-- Edit button (floating) -->
        <button
          *ngIf="showEditBtn"
          type="button"
          (click)="editClicked.emit()"
          class="flex items-center justify-center w-9 h-9 rounded-xl bg-white/80 dark:bg-[#2b2930]/80 backdrop-blur-md shadow-sm border border-black/5 dark:border-white/10 text-[#6750a4] dark:text-[#d0bcff] hover:bg-[#f3eeff] dark:hover:bg-[#6750a4]/20 transition-colors"
          aria-label="Modifica luogo"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
          </svg>
        </button>

        <!-- Delete button (floating) -->
        <button
          *ngIf="showDeleteBtn"
          type="button"
          (click)="deleteClicked.emit()"
          class="flex items-center justify-center w-9 h-9 rounded-xl bg-white/80 dark:bg-[#2b2930]/80 backdrop-blur-md shadow-sm border border-black/5 dark:border-white/10 text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-500/20 transition-colors"
          aria-label="Elimina luogo"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
          </svg>
        </button>

        <!-- Desktop nav: floating card -->
        <div class="hidden lg:flex items-center gap-0.5 px-2 py-1.5 rounded-2xl bg-white/80 dark:bg-[#2b2930]/80 backdrop-blur-md shadow-sm border border-black/5 dark:border-white/10">
          <button
            routerLink="/search"
            class="inline-flex items-center gap-1.5 px-3 py-1.5 text-sm font-medium rounded-xl text-gray-600 dark:text-gray-300 hover:bg-[#f3eeff] hover:text-[#6750a4] dark:hover:bg-[#6750a4]/20 dark:hover:text-[#d0bcff] transition-colors fill-current"

            </svg>
            <span>Home</span>
          </button>

      class="mobile-bottom-nav__item"
