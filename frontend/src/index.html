<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>How I Ate</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">  
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <!-- PWA manifest -->
  <link rel="manifest" href="manifest.webmanifest">

  <!-- Theme color (Chrome, Safari macOS 13+) -->
  <meta name="theme-color" content="#4F46E5">

  <!-- Apple / Safari PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="How I Ate">
  <link rel="apple-touch-icon" href="icons/icon-192x192.png">
</head>
<body class="min-h-screen bg-gray-50 text-gray-900 antialiased dark:bg-[#121212] dark:text-gray-100">
  <app-root></app-root>
  <script>
    // Disabilita il double-tap zoom sui dispositivi touch (es. Safari iOS)
    (function () {
      let lastTouchEnd = 0;

      document.addEventListener(
        'touchend',
        function (event) {
          const now = Date.now();

          // se due tap ravvicinati (<300ms), previeni lo zoom
          if (now - lastTouchEnd <= 300) {
            event.preventDefault();
          }
          lastTouchEnd = now;
        },
        { passive: false }
      );
    })();
  </script>
</body>
</html>
