<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>How I Ate</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <link rel="preconnect" href="https://how-i-ate-backend.vercel.app" crossorigin>
  <!-- Favicon light/dark -->
  <link rel="icon" type="image/webp" href="icons/favicon.webp" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/webp" href="icons/favicon-dark.webp" media="(prefers-color-scheme: dark)">

  <!-- PWA manifest -->
  <link rel="manifest" href="manifest.webmanifest">

  <!-- Theme color removed to avoid cross-browser compatibility warnings -->

  <!-- Apple / Safari PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="How I Ate">
  <link rel="apple-touch-icon" href="icons/Icon-iOS-Default.png" media="(prefers-color-scheme: light)">
  <link rel="apple-touch-icon" href="icons/Icon-iOS-Dark.png" media="(prefers-color-scheme: dark)">
  <style>
    app-root {
      display: block;
      min-height: 100vh;
    }

    app-root:empty {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    app-root:empty::before {
      content: '';
      width: 2.5rem;
      height: 2.5rem;
      border-radius: 9999px;
      border: 4px solid rgba(103, 80, 164, 0.16);
      border-top-color: #6750a4;
      animation: appBootSpin 1.1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    @keyframes appBootSpin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (prefers-color-scheme: dark) {
      app-root:empty::before {
        border-color: rgba(208, 188, 255, 0.16);
        border-top-color: #d0bcff;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      app-root:empty::before {
        animation-duration: 2.4s;
      }
    }
  </style>
</head>
<body class="min-h-screen bg-gray-50 text-gray-900 antialiased dark:bg-[#121212] dark:text-gray-100">
  <app-root></app-root>
  <script>
    // Disabilita il double-tap zoom sui dispositivi touch (es. Safari iOS)
    (function () {
      let lastTouchEnd = 0;

      document.addEventListener(
        'touchend',
        function (event) {
          const now = Date.now();

          // se due tap ravvicinati (<300ms), previeni lo zoom
          if (now - lastTouchEnd <= 300) {
            event.preventDefault();
          }
          lastTouchEnd = now;
        },
        { passive: false }
      );
    })();
  </script>
</body>
</html>
